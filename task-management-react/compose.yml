services:
    react:
        build:
            context: .
            args:
                VITE_API_URL: '${VITE_API_URL:-http://localhost:8000/api}'
        ports:
            - '${FRONTEND_PORT:-3000}:3000'

    react-dev:
        profiles: ['dev']
        image: node:24-alpine
        working_dir: /app
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
        environment:
            VITE_API_URL: '${VITE_API_URL:-http://localhost:8000/api}'
        ports:
            - '5173:5173'
        volumes:
            - ./:/app
            - react_node_modules:/app/node_modules

volumes:
    react_node_modules:
